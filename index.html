<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[PASS_GEN] // DEV_DASHBOARD</title>
  <meta name="description" content="Developer-grade cryptographic password generator" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  
  <!-- Tailwind CSS CDN & JetBrains Mono -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-black text-zinc-100 flex flex-col justify-between selection:bg-white selection:text-black">

  <!-- Top Navigation Bar -->
  <header class="border-b border-zinc-800 bg-black p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-3 h-3 bg-white animate-pulse"></div>
        <h1 class="text-lg font-extrabold tracking-wider text-white">[PASS_GEN::V2.0]</h1>
        <span class="text-xs bg-zinc-900 border border-zinc-700 px-2 py-0.5 text-zinc-400 font-mono">SYS_READY</span>
      </div>
      <div class="flex items-center gap-4 text-xs font-mono text-zinc-400">
        <div>CRYPTO: <span class="text-emerald-400">HARDWARE_RNG</span></div>
        <button id="btn-export" class="bg-zinc-900 hover:bg-zinc-800 text-white border border-zinc-700 px-3 py-1 transition-colors">EXPORT_DATA</button>
      </div>
    </div>
  </header>

  <!-- Dashboard Grid -->
  <main class="max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">

    <!-- Controls Panel -->
    <section class="lg:col-span-7 space-y-6">

      <!-- Output Display Box -->
      <div class="bg-zinc-950 border border-zinc-800 p-6 space-y-4">
        <div class="flex justify-between items-center text-xs text-zinc-500 font-mono">
          <span>// GENERATED_OUTPUT</span>
          <span id="output-badge">16 CHARS</span>
        </div>

        <div class="relative flex items-center">
          <input 
            type="text" 
            id="password-output" 
            readonly 
            class="w-full bg-black border border-zinc-700 px-4 py-4 text-xl md:text-2xl font-mono text-white tracking-wider focus:outline-none focus:border-white pr-28 select-all" 
            placeholder="Generating..."
          />
          <button 
            id="btn-copy-main" 
            class="absolute right-2 bg-white text-black font-bold px-4 py-2 hover:bg-zinc-200 transition-colors text-xs tracking-wider"
          >
            COPY
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input 
            type="text" 
            id="site-tag" 
            placeholder="Label / Site (e.g., github.com)" 
            class="sm:col-span-2 bg-black border border-zinc-800 px-3 py-2 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500"
          />
          <button 
            id="btn-save-log" 
            class="bg-zinc-900 border border-zinc-700 text-white text-xs py-2 hover:bg-zinc-800 transition-colors font-bold"
          >
            + SAVE TO LOG
          </button>
        </div>
      </div>

      <!-- Settings Panel -->
      <div class="bg-zinc-950 border border-zinc-800 p-6 space-y-6">
        
        <!-- Tabs -->
        <div class="flex border-b border-zinc-800">
          <button id="tab-standard" class="tab-btn px-4 py-2 border-b-2 border-white text-white font-bold text-xs tracking-wider">RANDOM_KEY</button>
          <button id="tab-passphrase" class="tab-btn px-4 py-2 border-b-2 border-transparent text-zinc-500 hover:text-white font-bold text-xs tracking-wider">PASSPHRASE</button>
          <button id="tab-batch" class="tab-btn px-4 py-2 border-b-2 border-transparent text-zinc-500 hover:text-white font-bold text-xs tracking-wider">BATCH_MODE</button>
        </div>

        <!-- Mode Panels -->
        <div id="panel-standard" class="space-y-5">
          <div>
            <div class="flex justify-between items-center text-xs text-zinc-400 mb-2">
              <label for="length-slider">KEY_LENGTH</label>
              <span id="slider-val" class="text-white font-bold text-sm">16</span>
            </div>
            <input type="range" id="length-slider" min="6" max="128" value="16" class="w-full h-2 bg-zinc-800 appearance-none cursor-pointer" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <label class="flex items-center space-x-3 bg-black border border-zinc-800 p-3 cursor-pointer hover:border-zinc-700">
              <input type="checkbox" id="opt-uppercase" checked /> <span>UPPERCASE (A-Z)</span>
            </label>
            <label class="flex items-center space-x-3 bg-black border border-zinc-800 p-3 cursor-pointer hover:border-zinc-700">
              <input type="checkbox" id="opt-lowercase" checked /> <span>LOWERCASE (a-z)</span>
            </label>
            <label class="flex items-center space-x-3 bg-black border border-zinc-800 p-3 cursor-pointer hover:border-zinc-700">
              <input type="checkbox" id="opt-numbers" checked /> <span>DIGITS (0-9)</span>
            </label>
            <label class="flex items-center space-x-3 bg-black border border-zinc-800 p-3 cursor-pointer hover:border-zinc-700">
              <input type="checkbox" id="opt-symbols" checked /> <span>SYMBOLS (!@#$)</span>
            </label>
            <label class="flex items-center space-x-3 bg-black border border-zinc-800 p-3 cursor-pointer hover:border-zinc-700 sm:col-span-2">
              <input type="checkbox" id="opt-ambiguous" /> <span>EXCLUDE AMBIGUOUS (0, O, I, 1, l)</span>
            </label>
          </div>
        </div>

        <div id="panel-passphrase" class="hidden space-y-4">
          <div class="grid grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block text-zinc-400 mb-1">WORD_COUNT</label>
              <input type="number" id="passphrase-words" min="3" max="12" value="4" class="w-full bg-black border border-zinc-800 p-2 text-white focus:outline-none" />
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">SEPARATOR</label>
              <select id="passphrase-sep" class="w-full bg-black border border-zinc-800 p-2 text-white focus:outline-none">
                <option value="-">Hyphen (-)</option>
                <option value="_">Underscore (_)</option>
                <option value=".">Dot (.)</option>
                <option value=" ">Space ( )</option>
              </select>
            </div>
          </div>
        </div>

        <div id="panel-batch" class="hidden space-y-4">
          <div class="flex justify-between items-center text-xs">
            <label class="text-zinc-400">BATCH_SIZE (5-20)</label>
            <input type="number" id="batch-count" min="5" max="20" value="8" class="bg-black border border-zinc-800 p-1 text-center w-16 text-white" />
          </div>
          <button id="btn-gen-batch" class="w-full bg-zinc-900 border border-zinc-700 text-white text-xs py-3 hover:bg-zinc-800">GENERATE_BATCH_LIST</button>
          <textarea id="batch-output" readonly rows="5" class="w-full bg-black border border-zinc-800 p-3 text-xs font-mono text-zinc-300 focus:outline-none" placeholder="Batch items..."></textarea>
        </div>

        <button id="btn-generate" class="w-full bg-white text-black font-extrabold text-sm py-4 tracking-widest hover:bg-zinc-200 transition-colors border border-white">
          // GENERATE_PASSWORD
        </button>

      </div>
    </section>

    <!-- Telemetry & History -->
    <section class="lg:col-span-5 space-y-6">

      <div class="bg-zinc-950 border border-zinc-800 p-6 space-y-5">
        <h2 class="text-xs text-zinc-500 font-mono tracking-wider">// CRYPTO_TELEMETRY</h2>

        <div class="grid grid-cols-2 gap-4">
          <div class="bg-black border border-zinc-800 p-4">
            <span class="block text-[10px] text-zinc-500">BIT_ENTROPY</span>
            <span id="metric-entropy" class="text-2xl font-bold text-white">0.0</span>
            <span class="text-[10px] text-zinc-600 block">BITS</span>
          </div>
          <div class="bg-black border border-zinc-800 p-4">
            <span class="block text-[10px] text-zinc-500">POOL_SIZE</span>
            <span id="metric-pool" class="text-2xl font-bold text-white">0</span>
            <span class="text-[10px] text-zinc-600 block">CHARS</span>
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex justify-between text-xs">
            <span class="text-zinc-400">STRENGTH:</span>
            <span id="strength-label" class="font-bold text-emerald-400">OPTIMAL</span>
          </div>
          <div class="w-full bg-zinc-900 h-2 border border-zinc-800">
            <div id="strength-bar" class="bg-emerald-400 h-full w-full transition-all duration-300"></div>
          </div>
        </div>

        <div class="bg-black border border-zinc-800 p-4 space-y-1">
          <span class="block text-[10px] text-zinc-500">ESTIMATED_TIME_TO_CRACK</span>
          <div id="metric-crack-time" class="text-sm font-mono text-white font-bold">--</div>
        </div>
      </div>

      <div class="bg-zinc-950 border border-zinc-800 p-6 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-xs text-zinc-500 font-mono tracking-wider">// SESSION_LOGS</h2>
          <button id="btn-purge-history" class="text-[10px] text-red-400 hover:underline">PURGE</button>
        </div>

        <div class="max-h-64 overflow-y-auto space-y-2 pr-1" id="history-container">
          <!-- Dynamically Rendered -->
        </div>
      </div>

    </section>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-white text-black font-bold px-6 py-3 border border-white text-xs opacity-0 pointer-events-none transition-opacity duration-300 z-50">
    NOTIFICATION
  </div>

  <!-- Flat Root Script Loading -->
  <script src="generator.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
